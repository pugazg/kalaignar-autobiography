      # Wave 7 combined Batches 2-4 P1 — INDEPENDENT source/import validator over the pinned stage-plays,
      # novels and essays checkouts: cohort 13 (2+5+6), subtree pins, scan SHAs, independent structural
      # counts == manifest == vendored payloads, nachuk-koppai qualification retained, arumbu/nadutheru/
      # sarapallam kept separate, no forbidden work leaked.
      - name: Wave 7 Batches 2-4 P1 — combined source/import fidelity (13 works)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-wave7-b2-b4-p1.mjs "$KDL_SOURCES_DIR/kalaignar-stage-plays-wave7" "$KDL_SOURCES_DIR/kalaignar-novels-wave7" "$KDL_SOURCES_DIR/kalaignar-essays-wave7"
      # Wave 7 combined Batches 2-4 P2 — INDEPENDENT source-fidelity of the render layer: re-derives every
      # reading unit (drama scenes, adapted novel sections, essay articles) from the pinned stage-plays,
      # novels and essays checkouts and proves the vendored payloads lose/invent nothing, the arumbu trio
      # stay three works sharing one publication, surulimalai's 6/7 gap is preserved and nachuk's hold is
      # carried verbatim. Runs in the source-integrity job because it needs the cloned sources.
      - name: Wave 7 Batches 2-4 P2 — source render fidelity (13 works)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-wave7-b2-b4-p2-fidelity.mjs "$KDL_SOURCES_DIR/kalaignar-stage-plays-wave7" "$KDL_SOURCES_DIR/kalaignar-novels-wave7" "$KDL_SOURCES_DIR/kalaignar-essays-wave7"
      # Wave 7 B5a / B5b / B6 / Kuraloviyam (101 works) — P1 INDEPENDENT source/import validation (census
      # set-equality derived from the source, subtree pins, qualification from the page records), P2
      # INDEPENDENT source fidelity (presence → structure → equality, Tamil + English, every work), and the
      # DETERMINISTIC REGENERATION proof: both importers regenerate every vendored payload + internal manifest
      # at the frozen pins and require byte-identity (510 files).
      - name: Wave 7 B5/B6/Kuraloviyam P1 — source/import fidelity (101 works)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-wave7-b5-b6-k-p1.mjs "$KDL_SOURCES_DIR/kalaignar-public-speeches-wave7" "$KDL_SOURCES_DIR/kalaignar-assembly-speeches-wave7" "$KDL_SOURCES_DIR/kalaignar-literary-commentary-wave7"
      - name: Wave 7 B5/B6/Kuraloviyam P2 — source render fidelity (101 works)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-wave7-b5-b6-k-p2-fidelity.mjs "$KDL_SOURCES_DIR/kalaignar-public-speeches-wave7" "$KDL_SOURCES_DIR/kalaignar-assembly-speeches-wave7" "$KDL_SOURCES_DIR/kalaignar-literary-commentary-wave7"
      - name: Wave 7 B5/B6/Kuraloviyam — deterministic regeneration (importers --verify)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: |
          node scripts/import-wave7-speeches.mjs "$KDL_SOURCES_DIR/kalaignar-public-speeches-wave7" "$KDL_SOURCES_DIR/kalaignar-assembly-speeches-wave7" --verify
          node scripts/import-kuraloviyam.mjs "$KDL_SOURCES_DIR/kalaignar-literary-commentary-wave7" --verify
      # Wave 8 P1 — hidden data foundation (Murasoli Vols 42-47, Ore Mutham, Sangath Tamil). Self-contained: the three
      # frozen source pins are read from the committed internal manifest, each repository is fetched BY SHA into its
      # own directory (outside the shared sources dir), and the importer regenerates everything in memory and fails
      # unless every committed artifact is byte-identical. The importer itself also refuses any commit or subtree
      # other than the frozen Wave-8 P0 pins.
      - name: Wave 8 P1 — deterministic regeneration from frozen pins (import-wave8 --verify)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          W8="$RUNNER_TEMP/wave8-sources"
          mkdir -p "$W8"
          pins=$(node -e '
            const m = require("./data/internal/wave8/wave8-p1-manifest.json");
            const s = m.sources;
            console.log(`murasoli ${s.murasoli.repo} ${s.murasoli.commit}`);
            console.log(`stage ${s.oreMutham.repo} ${s.oreMutham.commit}`);
            console.log(`lit ${s.sangatamil.repo} ${s.sangatamil.commit}`);
          ')
          echo "$pins" | while read -r dir repo pin; do
            git init -q "$W8/$dir"
            git -C "$W8/$dir" remote add origin "https://github.com/$repo.git"
            if ! git -C "$W8/$dir" fetch -q --depth 1 origin "$pin"; then
              echo "::error::Could not fetch $repo at pinned commit $pin"
              exit 1
            fi
            git -C "$W8/$dir" checkout -q FETCH_HEAD
            echo "$dir <- $repo @ $(git -C "$W8/$dir" rev-parse HEAD)"
          done
          node scripts/import-wave8.mjs "$W8/murasoli" "$W8/stage" "$W8/lit" --verify
      - name: Speeches batch (Wave 6 B3)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-speeches-wave6.mjs "$KDL_SOURCES_DIR/kalaignar-assembly-speeches-wave6" "$KDL_SOURCES_DIR/kalaignar-public-speeches-wave6"
      - name: Poetry (Wave 6 B4)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-poetry-wave6.mjs "$KDL_SOURCES_DIR/kalaignar-poems-wave6"
      # ONE coherent released batch, ONE validation step — the 37 stories of the 1977 anthology.
      # The script prints a PASS/FAIL line per story, so a failure names the story, not just the
      # batch, and any single story failing fails the whole job.
      - name: 1977 Short-Story Anthology — 37-work Fiction batch
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-1977-short-stories.mjs "$KDL_SOURCES_DIR/kalaignar-short-stories-1977-anthology"
      # Reading Room Wayfinding Phase 1. Proves the catalogue-facing collection declaration equals the
      # collection the SOURCE ARCHIVE registers — a different question from the 1977 batch validator
      # above, which proves the 37 released stories against the same frozen pin. Same checkout, same
      # pin, different witness.
      - name: Collections — 1977 anthology declaration
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-collections.mjs "$KDL_SOURCES_DIR/kalaignar-short-stories-1977-anthology"
      - name: Thirukkural
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-thirukkural.mjs "$KDL_SOURCES_DIR/kalaignar-literary-commentary"
      # Wave 6 Batch 7 short stories (hidden P1) — SOURCE-PIN FREEZE against the frozen short-stories
      # checkout: repo/commit/tree, per-work subtree pins, 1977-anthology disjointness. The build-boundary
      # portion of this validator is exercised in the build/UI job (which has the .next tree); here it
      # verifies the source side. Same validator, complementary evidence in the two jobs.
      - name: Wave 6 Batch 7 short stories — source-pin freeze (+ frozen-control set equality when reachable)
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          KDL_SOURCES_DIR: "${{ runner.temp }}/sources"
          GH_TOKEN: ${{ github.token }}
        run: |
          # Best-effort read-only checkout of the EXACT control commit that authorized this Batch-7
          # population (kalaignar-tribute @ ceccd2a5, merged via PR #32) — the frozen artifact to prove
          # set-equal to, never moving control main. The control repo is PRIVATE, so anonymous CI fetch
          # cannot reach it; attempt a token-authenticated fetch, and if the private control artifact is
          # not reachable from this repo's CI token, run the validator WITHOUT it. The source-pin freeze,
          # collection-pin, identity, payload, witness, collection-plan and hidden-boundary gates all
          # still run here; the pinned-control set-equality is additionally proven locally and in the
          # independent immutable-head review (which has control access). The commit is also recorded in
          # the manifest's controlAuthority.
          CTRL="$RUNNER_TEMP/b7-control"; CTRL_ARG=""
          git init -q "$CTRL"
          git -C "$CTRL" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/pugazg/kalaignar-tribute.git"
          if git -C "$CTRL" fetch -q --depth 1 origin ceccd2a5cf506a6f46ad6ec8baf892abf9c17a70 2>/dev/null; then
            git -C "$CTRL" checkout -q FETCH_HEAD && CTRL_ARG="$CTRL"
            echo "pinned control artifact reachable — running frozen-control set equality."
          else
            echo "::notice::Pinned control repo not reachable from this CI token (private); frozen-control set-equality is proven locally and in independent review."
          fi
          npx tsx --tsconfig tsconfig.scripts.json scripts/validate-wave6-b7-short-stories.ts "$KDL_SOURCES_DIR/kalaignar-short-stories-wave6-b7" $CTRL_ARG
          # Wave 6 Batch 7 P2 — independent literary-fidelity proof against the SAME pinned source. Its own
          # parser (does NOT import the production importer) proves title, Tamil/English flat-sequence
          # equality, exact per-segment scan + printed-page attribution, exact English source-marker scan
          # anchor, and that every payload↔source delta is a whitespace-only fold. Needs the source clone.
          npx tsx --tsconfig tsconfig.scripts.json scripts/validate-wave6-b7-p2-fidelity.ts "$KDL_SOURCES_DIR/kalaignar-short-stories-wave6-b7"
          # Wave 6 Batch 7 P4 — RE-DERIVE every collection's membership + ordinals (and the 2009 reprint's
          # own pagination) from that publication's indexes/story-inventory.md at the frozen pin, and prove
          # the committed data equals it — the independent proof that ordering is the SOURCE printed order,
          # not the P1 planning arrays. (Build-total checks self-skip here; they run in the build/UI job.)
          npx tsx --tsconfig tsconfig.scripts.json scripts/validate-wave6-b7-p4-integration.ts "$KDL_SOURCES_DIR/kalaignar-short-stories-wave6-b7"

      # Proves the migrated validators still obey docs/VALIDATOR_CONTRACT.md — that corrupted data
      # exits 1 naming the difference, and an unusable source exits 2. Runs last, after the sources
      # are already on disk, and mutates only disposable copies.
      - name: Validator contract
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/test-validator-contract.mjs "$KDL_SOURCES_DIR"
