              "novels/arumbu": { repo: "kalaignar-novels", dir: "kalaignar-novels-wave7" },
              "novels/nadutheru-narayani": { repo: "kalaignar-novels", dir: "kalaignar-novels-wave7" },
              "novels/sarapallam-samundi": { repo: "kalaignar-novels", dir: "kalaignar-novels-wave7" },
              "novels/surulimalai": { repo: "kalaignar-novels", dir: "kalaignar-novels-wave7" },
              "novels/vellikkizhamai": { repo: "kalaignar-novels", dir: "kalaignar-novels-wave7" },
              "essays/aaru-maatha-kadungkaaval": { repo: "kalaignar-essays", dir: "kalaignar-essays-wave7" },
