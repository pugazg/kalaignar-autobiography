name: Library CI

# Quality gates for the Digital Library web application.
#
# Until now every gate — typecheck, build, and the per-work validators — was run by hand.
# Vercel builds the site, but nothing checked types or verified that the released archival data
# still matches its pinned sources. This workflow automates exactly those existing gates. It adds
# no new checks and changes no validator behaviour.
#
# Phase 8D-2.1 closed a correctness gap: Thirukkural shipped in #32 and #33 with its validator
# wired into neither `npm run validate` nor this workflow, so the largest work in the library —
# 1330 Kurals, 32,949 assertions, and the review-page quotation trap that guards its text — was the
# only one merging with no automated protection. It is now fetched and validated like every other
# work, and the deterministic Daily Kural selection test runs alongside typecheck and build.
#
# Deliberately NOT in this workflow (Phase 8C-1 scope):
#   * importer re-run / determinism checks — that needs source-checkout orchestration and its own
#     review, so it is intentionally deferred rather than half-built here;
#   * anything touching readers, provenance components, generated data or source repositories.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "public/data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/library-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "public/data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/library-ci.yml"

jobs:
  build:
    name: typecheck • build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Deterministic feature test, not an archival validator: it needs no source clone, only the
      # released Thirukkural index. It pins FNV-1a against published vectors and a known date, so a
      # change to the hash — which would silently reassign every day's Kural, past and future —
      # fails here instead of shipping.
      - name: Daily Kural determinism
        run: npm run test:daily-kural

      - name: Reading Room collections
        run: npm run test:collections
      - name: Poetry architecture and scope
        run: npm run test:poetry-architecture
      - name: Reading Room shelf disclosure
        run: npm run test:shelf-disclosure
      # Runs AFTER the build above, so it can check the sitemap and prerendered pages the build
      # actually emitted — the archival-validators job never builds, so that half of the sitemap
      # proof can only run here.
      - name: Standalone poem UI across all four works
        run: npm run test:standalone-poem-ui
      - name: Poetry publication UI (Wave 4 P2)
        run: npm run test:publication-ui
      - name: Poetry publication + witness UI (Wave 4 P3)
        run: npm run test:p3-publication-ui

  validate:
    # Source-integrity gate. Each published work has a validator that derives its expectations from
    # the SOURCE ARCHIVE at the exact commit the released data is pinned to — so this job proves the
    # data in this repository still matches the archive it claims to come from.
    #
    # ── ACCESS ───────────────────────────────────────────────────────────────────────────────────
    # All eight source archives are PUBLIC repositories, so they are cloned anonymously and this job
    # needs NO secret. An earlier revision required a SOURCE_ARCHIVES_TOKEN because the archives were
    # private at the time; that dependency is gone, and with it the risk of the gate sitting red
    # waiting on a credential.
    #
    # What has NOT changed is the pinning discipline: sources are fetched BY the exact commit each
    # work records, never at a branch tip, and an unobtainable pin fails the job loudly rather than
    # falling back to whatever main happens to be.
    name: archival validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci


      # ── The source dependency model ───────────────────────────────────────────────────────────
      # Every validator takes the path to a clone of its source repository as argv[2], and refuses
      # to run unless that clone is checked out at the commit recorded in the work's own
      # provenance.json. Pins are therefore READ FROM EACH WORK'S RECORDED PROVENANCE PATH here,
      # never hardcoded in this workflow — if a pin moves, this step follows it automatically.
      # Most works record that file under public/data/; Film Songs records it under data/internal/,
      # which is outside Next.js public/ and so is not served as a static asset. CI reads it
      # directly from this repository checkout either way.
      #
      # Two of those pins are NOT branch tips (Manohara's `4b5f3238` most notably, because the
      # cinema repository has since moved on). A plain `git clone` would not contain them, so each
      # repository is fetched BY SHA. If a source repository or a pinned commit cannot be obtained,
      # this step FAILS LOUDLY naming the repo and pin — validation is never silently skipped.
      - name: Fetch source archives at their pinned commits
        id: fetch
        env:
          KDL_SOURCES_DIR: ${{ runner.temp }}/sources
        run: |
          set -euo pipefail
          mkdir -p "$KDL_SOURCES_DIR"
          pins=$(node -e '
            const fs = require("fs");
            // Each work names the repository it comes from AND the directory it is
            // checked out into. They are usually the same, but three cinema works pin
            // the SAME archive at DIFFERENT commits — Manohara at a historical pin,
            // Tirumbippaar at its publication pin and Film Songs at its own — and one
            // checkout cannot be at all three. Those three therefore get their own
            // directories, so each validator still sees a tree whose HEAD is exactly
            // its own pin.
            //
            // `provenance` is optional and overrides the default public/data path. Film
            // Songs keeps its provenance outside public/ so the archival apparatus is
            // not a served static asset, so it names that path here.
            const works = {
              "cinema/manohara": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-manohara" },
              "cinema/tirumbippaar": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-tirumbippaar" },
              "cinema/thirai-isai-paadalgal": {
                repo: "kalaignar-cinema-works",
                dir: "kalaignar-cinema-works-thirai-isai-paadalgal",
                provenance: "data/internal/thirai-isai-paadalgal/provenance.json",
              },
              "speeches/udhaya-kathir": { repo: "kalaignar-assembly-speeches" },
              "speeches/poonthottam": { repo: "kalaignar-public-speeches" },
              "speeches/arappor": { repo: "kalaignar-public-speeches" },
              // Shares the public-speeches checkout with Poonthottam and Arappor: all three pin
              // the SAME commit, so one directory serves them and the same-directory/same-pin
              // guard below keeps its meaning. It is deliberately NOT given a directory of its own.
              "speeches/kalaivanar-nsk-memorial-day": { repo: "kalaignar-public-speeches" },
              "poems/idhayathai-thanthidu-anna": { repo: "kalaignar-poems" },
              // ── WAVE 4 P1 — the three standalone poems ──────────────────────────────────────
              // These pin the poems archive at the Wave-4 freeze, a LATER commit than
              // idhayathai-thanthidu-anna above, whose own work tree never moved and which is
              // therefore not repinned. Same repository, two historical pins, so they get their own
              // checkout directory — the pattern the Wave-3 essays and the நான்மணி மாலை plays
              // already use. Sharing one directory would make the same-directory/same-pin guard
              // below fire, and loosening that guard would remove the protection it exists to give.
              "poems/anaiya-vilakku-anna": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave4" },
              "poems/marathi": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave4" },
              "poems/thennan-kathai": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave4" },
              "essays/sakkaravarththiyin-thirumagan": { repo: "kalaignar-essays" },
              // ── BULK ONBOARDING WAVE 3 ──────────────────────────────────────────────────────
              // These three publications pin the essays archive at a LATER commit than
              // sakkaravarththiyin-thirumagan above, so they get their own checkout directory. Sharing
              // one directory across two different historical pins would make the same-directory/
              // same-pin guard below fire, and loosening that guard would remove the protection it
              // exists to give. The essays repository also advances constantly for ina-muzhakkam,
              // which is NOT part of this batch.
              "essays/kayittril-thongiya-kanapathi": { repo: "kalaignar-essays", dir: "kalaignar-essays-wave3" },
              "essays/unarchchimaalai": { repo: "kalaignar-essays", dir: "kalaignar-essays-wave3" },
              "essays/thiraavida-sampaththu": { repo: "kalaignar-essays", dir: "kalaignar-essays-wave3" },
              "novels/balipeedam-nokki": { repo: "kalaignar-novels" },
              "plays/silappathikaram-nataka-kappiyam": { repo: "kalaignar-stage-plays" },
              // The four நான்மணி மாலை plays pin the stage-plays archive at a DIFFERENT, later
              // commit than Silappathikaram, so they get their own checkout directory — the same
              // pattern the three cinema works already use. Sharing one directory would make the
              // same-directory/same-pin guard below fire, and weakening that guard to accommodate
              // them would remove the protection it exists to give.
              "plays/bharathayanam": { repo: "kalaignar-stage-plays", dir: "kalaignar-stage-plays-naanmani-malai" },
              "plays/anarkali": { repo: "kalaignar-stage-plays", dir: "kalaignar-stage-plays-naanmani-malai" },
              "plays/socrates": { repo: "kalaignar-stage-plays", dir: "kalaignar-stage-plays-naanmani-malai" },
              "plays/cheran-senguttuvan": { repo: "kalaignar-stage-plays", dir: "kalaignar-stage-plays-naanmani-malai" },
              "thirukkural": { repo: "kalaignar-literary-commentary" },
              // ── BULK ONBOARDING WAVE 2 ──────────────────────────────────────────────────────
              // The 37 stories of the 1977 anthology pin the short-stories archive at ONE commit,
              // which is NOT the earlier pin `kizhavan-kanavu` uses. They therefore get their own checkout
              // directory rather than sharing one — the same reason the நான்மணி மாலை plays are kept
              // apart from Silappathikaram above. Sharing a directory across two different historical
              // pins would make the same-directory/same-pin guard below fire, and loosening that guard
              // would remove exactly the protection it exists to give.
              ...Object.fromEntries(
                [
                "pugazhendhi", "nalayini", "sabalam", "aattakkavadi",
                "kuppai-thotti", "santhana-kinnam", "sangilichami", "gangaiyin-kadhal",
                "thaaymai", "thappivittargal", "thappavillai", "aatharikkirar",
                "iragasiyam", "munnuru-rupai", "ezhai", "originalil-ullapadi",
                "panangulai", "seththaval-kathai", "pretha-visaranai", "kandathum-kadhal-ozhiga",
                "aalamarathup-puraakkal", "thothukkili", "kadhal-kaditham", "kannadakkam",
                "vazha-mudiyathavargal", "abagya-chinthamani", "palaivana-roja", "puratchip-padam",
                "thidukkidum-kathai", "kadaisi-kattam", "ayyo-raja", "visham-inidhu",
                "veniyin-kadhalan", "amirthamathi", "sumanthaval", "siddharthan-silai",
                "nunikkarumbu",
                ].map((s) => [
                  `stories/${s}`,
                  { repo: "kalaignar-short-stories", dir: "kalaignar-short-stories-1977-anthology" },
                ]),
              ),
            };
            const seen = new Map();
            for (const [p, spec] of Object.entries(works)) {
              const repo = spec.repo;
              const dir = spec.dir ?? spec.repo;
              const f = spec.provenance ?? `public/data/${p}/provenance.json`;
              const pin = JSON.parse(fs.readFileSync(f, "utf8")).sourceCommit;
              if (!/^[0-9a-f]{40}$/.test(pin ?? "")) {
                console.error(`::error::${f} does not record a valid sourceCommit`);
                process.exit(1);
              }
              // Still fail closed: two works sharing ONE directory must agree on the
              // pin. Works that legitimately differ are separated by directory above,
              // so this guard keeps its meaning instead of being loosened away.
              const prev = seen.get(dir);
              if (prev && prev.pin !== pin) {
                console.error(`::error::${dir} is pinned to two different commits (${prev.pin} and ${pin})`);
                process.exit(1);
              }
              seen.set(dir, { repo, pin });
            }
            for (const [dir, { repo, pin }] of seen) console.log(`${dir} ${repo} ${pin}`);
          ')
          echo "$pins" | while read -r dir repo pin; do
            echo "::group::$dir <- $repo @ $pin"
            dest="$KDL_SOURCES_DIR/$dir"
            git init -q "$dest"
            # Public repositories: anonymous clone, no credential needed.
            git -C "$dest" remote add origin "https://github.com/pugazg/$repo.git"
            # Fetch BY SHA: several pins are historical and are not any branch tip.
            if ! git -C "$dest" fetch -q --depth 1 origin "$pin"; then
              echo "::error::Could not fetch $repo at pinned commit $pin — validation cannot proceed."
              echo "The validator for this work will NOT be skipped; this job fails instead."
              exit 1
            fi
            git -C "$dest" checkout -q FETCH_HEAD
            echo "checked out $(git -C "$dest" rev-parse HEAD)"
            echo "::endgroup::"
          done

      # One step per work, so a failure names the work in the Actions UI without reading logs.
      - name: Manohara
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-manohara.mjs "$KDL_SOURCES_DIR/kalaignar-cinema-works-manohara"
      - name: Tirumbippaar
        if: always()
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-tirumbippaar.mjs "$KDL_SOURCES_DIR/kalaignar-cinema-works-tirumbippaar"
      - name: Kalaignar Film Songs
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-thirai-isai-paadalgal.mjs "$KDL_SOURCES_DIR/kalaignar-cinema-works-thirai-isai-paadalgal"
      - name: Udhaya Kathir
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-udhaya-kathir.mjs "$KDL_SOURCES_DIR/kalaignar-assembly-speeches"
      - name: Poonthottam
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-poonthottam.mjs "$KDL_SOURCES_DIR/kalaignar-public-speeches"
      - name: Arappor
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-arappor.mjs "$KDL_SOURCES_DIR/kalaignar-public-speeches"
      - name: Kalaivanar NSK Memorial Speech
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-kalaivanar-nsk-memorial-day.mjs "$KDL_SOURCES_DIR/kalaignar-public-speeches"
      - name: Idhayathai Thanthidu Anna
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-idhayathai-thanthidu-anna.mjs "$KDL_SOURCES_DIR/kalaignar-poems"
      # ONE coherent batch, ONE validation step — the four standalone poems. It takes BOTH
      # checkouts: the three new works are verified against the Wave-4 freeze, and the existing
      # poem's pin is verified in the clone that actually contains it, since each is fetched
      # --depth 1 by SHA and neither contains the other's commit.
      - name: Wave 4 P1 — standalone poems
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-wave4-p1-standalone-poems.mjs "$KDL_SOURCES_DIR/kalaignar-poems-wave4" "$KDL_SOURCES_DIR/kalaignar-poems"
      - name: Wave 4 P2 — Kaalap Pezhai publication
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-wave4-p2-kaalap-pezhai.mjs "$KDL_SOURCES_DIR/kalaignar-poems-wave4"
      - name: Wave 4 P3 — Kalaignarin Kavithaigal publication
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-wave4-p3-kalaignarin-kavithaigal.mjs "$KDL_SOURCES_DIR/kalaignar-poems-wave4"
      - name: Sakkaravarththiyin Thirumagan
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-sakkaravarththiyin-thirumagan.mjs "$KDL_SOURCES_DIR/kalaignar-essays"
      # ONE coherent released batch, ONE validation step — the three Wave-3 publications. The
      # script prints a PASS/FAIL line per publication, so a failure names the work, and any
      # single publication failing fails the whole job.
      - name: Wave 3 Essays — 3-publication batch
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-wave3-essays.mjs "$KDL_SOURCES_DIR/kalaignar-essays-wave3"
      - name: Balipeedam Nokki
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-balipeedam-nokki.mjs "$KDL_SOURCES_DIR/kalaignar-novels"
      - name: Silappathikaram Nataka Kappiyam
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-silappathikaram.mjs "$KDL_SOURCES_DIR/kalaignar-stage-plays"
      # ONE coherent released batch, ONE validation step. The script itself prints a PASS/FAIL line
      # per work, so a failure still names the play rather than just the batch.
      - name: Naanmani Malai Plays — 4-work Drama batch
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-naanmani-malai-plays.mjs "$KDL_SOURCES_DIR/kalaignar-stage-plays-naanmani-malai"
      # ONE coherent released batch, ONE validation step — the 37 stories of the 1977 anthology.
      # The script prints a PASS/FAIL line per story, so a failure names the story, not just the
      # batch, and any single story failing fails the whole job.
      - name: 1977 Short-Story Anthology — 37-work Fiction batch
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-1977-short-stories.mjs "$KDL_SOURCES_DIR/kalaignar-short-stories-1977-anthology"
      # Reading Room Wayfinding Phase 1. Proves the catalogue-facing collection declaration equals the
      # collection the SOURCE ARCHIVE registers — a different question from the 1977 batch validator
      # above, which proves the 37 released stories against the same frozen pin. Same checkout, same
      # pin, different witness.
      - name: Collections — 1977 anthology declaration
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-collections.mjs "$KDL_SOURCES_DIR/kalaignar-short-stories-1977-anthology"
      - name: Thirukkural
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/validate-thirukkural.mjs "$KDL_SOURCES_DIR/kalaignar-literary-commentary"

      # Proves the migrated validators still obey docs/VALIDATOR_CONTRACT.md — that corrupted data
      # exits 1 naming the difference, and an unusable source exits 2. Runs last, after the sources
      # are already on disk, and mutates only disposable copies.
      - name: Validator contract
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env: { KDL_SOURCES_DIR: "${{ runner.temp }}/sources" }
        run: node scripts/test-validator-contract.mjs "$KDL_SOURCES_DIR"
