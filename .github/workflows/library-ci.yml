name: Library CI

# Quality gates for the Digital Library web application.
#
# Until now every gate — typecheck, build, and the per-work validators — was run by hand.
# Vercel builds the site, but nothing checked types or verified that the released archival data
# still matches its pinned sources. This workflow automates exactly those existing gates. It adds
# no new checks and changes no validator behaviour.
#
# Phase 8D-2.1 closed a correctness gap: Thirukkural shipped in #32 and #33 with its validator
# wired into neither `npm run validate` nor this workflow, so the largest work in the library —
# 1330 Kurals, 32,949 assertions, and the review-page quotation trap that guards its text — was the
# only one merging with no automated protection. It is now fetched and validated like every other
# work, and the deterministic Daily Kural selection test runs alongside typecheck and build.
#
# Deliberately NOT in this workflow (Phase 8C-1 scope):
#   * importer re-run / determinism checks — that needs source-checkout orchestration and its own
#     review, so it is intentionally deferred rather than half-built here;
#   * anything touching readers, provenance components, generated data or source repositories.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "public/data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/library-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "public/data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/library-ci.yml"

jobs:
  build:
    name: typecheck • build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Deterministic feature test, not an archival validator: it needs no source clone, only the
      # released Thirukkural index. It pins FNV-1a against published vectors and a known date, so a
      # change to the hash — which would silently reassign every day's Kural, past and future —
      # fails here instead of shipping.
      - name: Daily Kural determinism
        run: npm run test:daily-kural

      - name: Reading Room collections
        run: npm run test:collections
      - name: Poetry architecture and scope
        run: npm run test:poetry-architecture
      - name: Reading Room shelf disclosure
        run: npm run test:shelf-disclosure
      # Runs AFTER the build above, so it can check the sitemap and prerendered pages the build
      # actually emitted — the archival-validators job never builds, so that half of the sitemap
      # proof can only run here.
      - name: Standalone poem UI across all four works
        run: npm run test:standalone-poem-ui
      - name: Poetry publication UI (Wave 4 P2)
        run: npm run test:publication-ui
      - name: Poetry publication + witness UI (Wave 4 P3)
        run: npm run test:p3-publication-ui
      - name: Poetry publication landing copy (post-Wave-4 regression)
        run: npm run test:publication-landing-copy
      - name: Cinema readers — Manthiri Kumari + Raja Rani (Wave 5 P2)
        run: npm run test:wave5-p2-cinema-ui
      - name: Cinema catalogue/discovery/sitemap (Wave 5 P3)
        run: npm run test:wave5-p3-cinema-catalogue
      # Wave 5 P4 — Cinema cross-work integrity + public-semantics hardening. No source clone: both
      # gates consume the vendored approved payloads and the real in-repo structures. Placed AFTER the
      # build so the integrity gate's build-output boundary (prerender-manifest routes, .html count,
      # Wave-5 routes present / invalid absent) reads the real .next artifacts from the Build step above.
      - name: Cinema cross-work integrity (Wave 5 P4)
        run: npm run test:wave5-p4-cinema-integrity
      - name: Cinema cross-work UI regression (Wave 5 P4)
        run: npm run test:wave5-p4-cinema-ui
      # Wave 6 Batch 1 — Ammayappan direct readers/routes (P1–P3). Consumes the vendored frozen payload
      # and the real route registry; placed AFTER the build so its build-route boundary reads the real
      # .next artifacts. Proves the 65-route set, fail-closed slugs, render semantics, and that the work
      # is published to the sitemap, catalogue and /read discovery (Wave 6 P4).
      - name: Cinema Ammayappan direct readers/routes (Wave 6 B1)
        run: npm run test:wave6-b1-ammaiyappan
      # Wave 6 Batch 2 — Drama direct readers/routes (P1–P3): the 83-route set derived from the three
      # released play registries, fail-closed slugs, render semantics (compressed range / unnumbered
      # காட்சி / 47 scenes / 7 SRUs / intertitle / source-condition holds / 1962 not promoted), and
      # that all three works are published to the sitemap, catalogue and /read discovery (Wave 6 P4).
      - name: Drama direct readers/routes (Wave 6 B2)
        run: npm run test:wave6-b2-drama
      # Wave 6 Batch 3 — Speeches direct readers/routes (P1–P3): the 6-route set (2 per work — reader
      # + source), fail-closed slugs, rendered source semantics (date/venue null, two-House witness,
      # 7-section booklet, compilation), and that all three are published to sitemap/catalogue/discovery.
      - name: Speeches direct readers/routes (Wave 6 B3)
        run: npm run test:wave6-b3-speeches
      # Wave 6 Batch 4 — Poetry direct readers/routes (P1–P3): the 30-route set (6 standalone
      # landing+source; the 1975 publication landing+source + 3 source items 01/02/04, no invented 03;
      # the oruthalaik-kathal verse-novel landing+source + 11 section routes), fail-closed slugs, the
      # verse-novel rendered as SECTIONS not poems, and that all eight are published to sitemap/catalogue/discovery.
      - name: Poetry direct readers/routes (Wave 6 B4)
        run: npm run test:wave6-b4-poetry
      # Wave 6 Batch 5 — Novels direct readers/routes: the exact 63-route set (Periya 9 + Pudhaiyal
      # 54) registry+payload-derived, fail-closed slugs, Periya rendered as archive reading divisions
      # and Pudhaiyal as an Introduction + numbered source chapters, no Balipeedam facts leaking, and
      # both works published to sitemap/catalogue/discovery (Wave 6 P4).
      - name: Novels direct readers/routes (Wave 6 B5)
        run: npm run test:wave6-b5-novels
      # Wave 6 Batch 6 — Essays direct readers/routes: the exact 74-route set (5 landings + 5 /source +
      # 64 article routes), fail-closed slugs, vedhanai rendered as a message (never a speech),
      # kudumbaththin with no invented year, sinthanaiyum as 50 articles across five transfer PDFs, and
      # all five published to sitemap/catalogue/discovery (Wave 6 P4).
      - name: Essays direct readers/routes (Wave 6 B6)
        run: npm run test:wave6-b6-essays
      # Wave 6 cumulative-manifest + global build-boundary — owns the whole-build delta that Wave-5 P4
      # A7 shed: build == frozen pre-Wave-6 baseline + cumulative Wave-6 route manifest (3681/3676).
      # Phase-agnostic: P4 exposes those 321 routes but adds none, so the build totals are unchanged.
      # Public exposure is proven separately by the Wave 6 P4 integration step below. Runs after Build.
      - name: Wave 6 cumulative-manifest + build boundary
        run: npm run test:wave6-p3-build
      # Wave 6 P4 public integration — catalogue 78→100 (exact 9-shelf census, 22 works once, no
      # Batch-7 leakage), collections still 1, /read discovery 42→64 (39 visible, 5 over-cap shelves),
      # sitemap 3351→3672 (0 dup, Wave-6 URL set == p3-routes.json exactly), 0 new routes (build
      # 3681/3676 unchanged), registry-promotion uniqueness, and source-faithful catalogue copy. After Build.
      - name: Wave 6 P4 public integration (catalogue/discovery/sitemap)
        run: npm run test:wave6-p4-integration
      # Wave 6 Batch 7 P1 — HIDDEN short-story data foundation (116 works). Runs after Build so its
      # zero-new-routes gate reads the real .next artifacts: proves 116 canonical / unique / group
      # arithmetic, 116 hidden payload sets, witness non-inflation, the owner-decided future-collection
      # plan, and that NOTHING leaked into STORY_SLUGS / LIBRARY_WORKS / LIBRARY_COLLECTIONS / /read /
      # sitemap (catalogue 100, collections 1, discovery 64/39, Fiction 41, sitemap 3672/0, build
      # 3681/3676 unchanged). Live source-pin recheck runs in the source-integrity job below.
      - name: Wave 6 Batch 7 P1 hidden short-story foundation
        run: npm run test:wave6-b7-short-stories
      # Wave 6 Batch 7 P2 — reader/provenance runtime regression (no source clone): renders all 116
      # hidden payloads through StoryReader (Tamil default + English toggle) and StorySourceB7, proves no
      # null/undefined/apparatus leaks in the UI, and that the 38 already-published stories still render
      # through the legacy components unchanged. Pure component render — needs no build artifacts.
      - name: Wave 6 Batch 7 P2 reader/provenance render regression
        run: npm run test:wave6-b7-p2-render
      # Wave 6 Batch 7 P3 — direct routes, still hidden. Runs after Build so it reads the real .next:
      # proves the route helper == the 116-slug manifest, 232 reader+source routes prerendered (deduped
      # with STORY_SLUGS, unknown slug fails closed), every payload loads and reader/provenance render,
      # and NOTHING leaked (catalogue 100, collections 1, discovery 64/39, Fiction 41, sitemap 3672/0,
      # build 3913/3908). The public surface is unchanged; only direct addressability is added.
      - name: Wave 6 Batch 7 P3 direct-but-hidden routes
        run: npm run test:wave6-b7-p3-routes
      # Wave 6 Batch 7 P4 — the authoritative published-surface + collection gate. Runs after Build so it
      # reads the real .next: catalogue 100→216, Fiction 41→157, STORY_SLUGS 154, 6 collections (source
      # ordinals, plural jaadi/kuruvi, no duplicate work, 2009 reprint shows its own pages), discovery
      # 64→77 (40 visible, Fiction over-cap), sitemap 3672→3909/0, build 3918/3913, ~18 adversarials. The
      # source-order RE-DERIVATION of every collection runs in the source-integrity job below (needs the pin).
      - name: Wave 6 Batch 7 P4 publication integration (catalogue/collections/discovery/sitemap)
        run: npm run test:wave6-b7-p4-integration
      # Wave 7 Batch 1 P1 — hidden-boundary validator, RECONCILED at P4 and PHASE-AWARE. Runs after Build
      # so its build-boundary check reads the real .next. It preserves the frozen P1 boundary (216/7/77-40/
      # 3909/3918-3913, 0 new routes) verbatim and proves the live surface == that boundary + this batch's
      # recorded contribution (+3 works, +133 routes) → 219/10/80-40/4042/4051-4046, and nothing else leaked.
      - name: Wave 7 Batch 1 P1 hidden-boundary (reconciled)
        run: npm run test:wave7-b1-p1
      # Wave 7 Batch 1 P2 — render layer. INDEPENDENT semantic fidelity (re-derives every count from the raw
      # vendored payloads, recomputes the Reading-Room SHA, proves the normalizer loses/invents nothing) and
      # a render regression (3 works' landing/scene/source + an Ammayappan shared-primitive witness). Pure
      # payload + component render — no source clone, no build artifacts.
      - name: Wave 7 Batch 1 P2 semantic fidelity
        run: npm run test:wave7-b1-p2-fidelity
      - name: Wave 7 Batch 1 P2 render regression
        run: npm run test:wave7-b1-p2-render
      # Wave 7 Batch 1 P3 — direct routes. Runs after Build so it reads the real .next: the 133 routes
      # (landing + per-scene section + source) re-derived independently == the P3 manifest, generateStaticParams
      # fail-closed (dynamicParams=false), routes prerendered, and the phase-appropriate discovery state.
      - name: Wave 7 Batch 1 P3 direct routes
        run: npm run test:wave7-b1-p3-routes
      # Wave 7 Batch 1 P4 — the authoritative published-surface gate. Runs after Build so it reads the real
      # .next: catalogue 216→219, Cinema 7→10, discovery 77→80/40, sitemap 3909→4042/0, build 3918→4051 /
      # 3913→4046, plus ~10 adversarial mutation checks (workTree swap, Naam reader_json_sha256 substitution,
      # fabricated year, collapsed unnumbered opening, removed/reordered performance identity, resolved
      # authorship, duplicate identity, omitted/invalid route).
      - name: Wave 7 Batch 1 P4 publication integration
        run: npm run test:wave7-b1-p4-integration
      # Wave 7 combined Batches 2-4 P1 — hidden-boundary. Runs after Build so its zero-new-routes gate
      # reads the real .next: the 13 onboarded works (2 Drama + 5 Novels + 6 Essays) change NO public
      # surface — catalogue 219, Drama 8, Fiction 157, Essays 9, Cinema 10, /read 80/40, sitemap 4042/0,
      # build 4051/4046 unchanged, 0 new B2-B4 routes; none of the 13 slugs is a LibraryWork or public URL.
      - name: Wave 7 Batches 2-4 P1 hidden-boundary
        run: npm run test:wave7-b2-b4-p1-hidden
      # Wave 7 combined Batches 2-4 P2 — render layer. Proves the P1 payloads render through the EXISTING
      # family readers (Play/Novel/Article) — generic components + the bounded novel adapter — and exercises
      # the REAL English client-state path (initialShowEn), not just the Tamil default. Pure payload +
      # component render; no source clone, no build artifacts.
      - name: Wave 7 Batches 2-4 P2 render regression
        run: npm run test:wave7-b2-b4-p2-render
      # Wave 7 combined Batches 2-4 P3 — direct routes. Runs after Build so it reads the real .next: the 224
      # routes (drama 83 + novels 62 + essays 79) re-derived independently == the P3 manifest,
      # generateStaticParams fail-closed, surulimalai's 6/7 chapter gap preserved, and the phase-appropriate
      # discovery/sitemap/build state (hidden pre-P4; published + arumbu-1978 collection route at P4).
      - name: Wave 7 Batches 2-4 P3 direct routes
        run: npm run test:wave7-b2-b4-p3-routes
      # Wave 7 combined Batches 2-4 P4 — the authoritative published-surface gate. Runs after Build so it
      # reads the real .next: catalogue 219→232 (Drama 8→10, Fiction 157→162, Essays 9→15, Cinema 10),
      # collections 6→7 (arumbu-1978: 3 members, ordinals unset, periya witness-only, trio never collapsed),
      # discovery 80→91/40, sitemap 4042→4267/0, build 4275→4276 / 4270→4271, plus 18 adversarial checks.
      - name: Wave 7 Batches 2-4 P4 publication integration
        run: npm run test:wave7-b2-b4-p4-integration
      # Essay public provenance — what every /essays/*/source page publishes. Runs after Build: it reads the
      # generated HTML + RSC payload and proves no internal archival state (the frozen P1 `hidden` object,
      # wave/batch/readiness markers) is serialized to the browser, that the page passes ONLY the allowlist
      # projection to the client component, and that public notes carry no stale workflow-state wording.
      - name: Essay public provenance (notes + serialization boundary)
        run: npm run test:essay-public-provenance
      # Wave 7 B5a / B5b / B6 / Kuraloviyam — the build/UI/public-boundary gates (after Build). The generated
      # catalogue must equal a fresh generation; P1 hidden boundary is stage-aware; P2 renders every work in
      # both UI languages and layers; P3 proves the 510 direct routes; P4 owns the published surface; the
      # public-provenance test reads the BUILT HTML + RSC of every speech /source page and every Kuraloviyam
      # page and proves no internal archival state is serialized to the browser.
      - name: Wave 7 B5/B6/Kuraloviyam — generated catalogue is byte-identical
        run: node scripts/generate-wave7-b5-b6-k-catalogue.mjs --verify
      - name: Wave 7 B5/B6/Kuraloviyam P1 hidden-boundary (stage-aware)
        run: npm run test:wave7-b5-b6-k-p1-hidden
      - name: Wave 7 B5/B6/Kuraloviyam P2 render regression
        run: npm run test:wave7-b5-b6-k-p2-render
      - name: Wave 7 B5/B6/Kuraloviyam P3 routes
        run: npm run test:wave7-b5-b6-k-p3-routes
      - name: Wave 7 B5/B6/Kuraloviyam P4 publication integration
        run: npm run test:wave7-b5-b6-k-p4-integration
      - name: Wave 7 B5/B6/Kuraloviyam public provenance (built HTML/RSC serialization)
        run: npm run test:wave7-b5-b6-k-public-provenance
      # Drama /source pages: the route hands PlaySource only the recursive allowlist projection. Reads the BUILT
      # HTML + RSC of all 10 Drama source pages; archival hidden/wave/batch/readiness stay in the JSON only.
      - name: Drama public provenance (built HTML/RSC serialization)
        run: npm run test:drama-public-provenance
      # Wave 8 P1 hidden foundation — the public surface is exactly the Wave-7 accepted baseline (catalogue, shelves,
      # collections, discovery, sitemap, build, route registries, byte-identical Murasoli 48-54) while the internal
      # Wave-8 data holds Murasoli 42-47, Ore Mutham and Sangath Tamil with their source-faithful invariants.
      - name: Wave 8 P1 hidden foundation (public boundary + internal invariants)
        run: npm run test:wave8-p1-hidden
      # Wave 4 P4 — cross-witness regression / public-semantics hardening. Both steps derive their
      # expectations from the witness registry + resolver + already-vendored payloads (no source
      # clone), so they run here in the build/UI job rather than the source-integrity job below.
      - name: Poetry witness relations — integrity (Wave 4 P4)
        run: npm run test:p4-witness-integrity
      - name: Poetry witness relations — UI regression (Wave 4 P4)
        run: npm run test:p4-witness-ui

  validate:
    # Source-integrity gate. Each published work has a validator that derives its expectations from
    # the SOURCE ARCHIVE at the exact commit the released data is pinned to — so this job proves the
    # data in this repository still matches the archive it claims to come from.
    #
    # ── ACCESS ───────────────────────────────────────────────────────────────────────────────────
    # All eight source archives are PUBLIC repositories, so they are cloned anonymously and this job
    # needs NO secret. An earlier revision required a SOURCE_ARCHIVES_TOKEN because the archives were
    # private at the time; that dependency is gone, and with it the risk of the gate sitting red
    # waiting on a credential.
    #
    # What has NOT changed is the pinning discipline: sources are fetched BY the exact commit each
    # work records, never at a branch tip, and an unobtainable pin fails the job loudly rather than
    # falling back to whatever main happens to be.
    name: archival validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci


      # ── The source dependency model ───────────────────────────────────────────────────────────
      # Every validator takes the path to a clone of its source repository as argv[2], and refuses
      # to run unless that clone is checked out at the commit recorded in the work's own
      # provenance.json. Pins are therefore READ FROM EACH WORK'S RECORDED PROVENANCE PATH here,
      # never hardcoded in this workflow — if a pin moves, this step follows it automatically.
      # Most works record that file under public/data/; Film Songs records it under data/internal/,
      # which is outside Next.js public/ and so is not served as a static asset. CI reads it
      # directly from this repository checkout either way.
      #
      # Two of those pins are NOT branch tips (Manohara's `4b5f3238` most notably, because the
      # cinema repository has since moved on). A plain `git clone` would not contain them, so each
      # repository is fetched BY SHA. If a source repository or a pinned commit cannot be obtained,
      # this step FAILS LOUDLY naming the repo and pin — validation is never silently skipped.
      - name: Fetch source archives at their pinned commits
        id: fetch
        env:
          KDL_SOURCES_DIR: ${{ runner.temp }}/sources
        run: |
          set -euo pipefail
          mkdir -p "$KDL_SOURCES_DIR"
          pins=$(node -e '
            const fs = require("fs");
            // Each work names the repository it comes from AND the directory it is
            // checked out into. They are usually the same, but three cinema works pin
            // the SAME archive at DIFFERENT commits — Manohara at a historical pin,
            // Tirumbippaar at its publication pin and Film Songs at its own — and one
            // checkout cannot be at all three. Those three therefore get their own
            // directories, so each validator still sees a tree whose HEAD is exactly
            // its own pin.
            //
            // `provenance` is optional and overrides the default public/data path. Film
            // Songs keeps its provenance outside public/ so the archival apparatus is
            // not a served static asset, so it names that path here.
            const works = {
              "cinema/manohara": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-manohara" },
              "cinema/tirumbippaar": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-tirumbippaar" },
              "cinema/thirai-isai-paadalgal": {
                repo: "kalaignar-cinema-works",
                dir: "kalaignar-cinema-works-thirai-isai-paadalgal",
                provenance: "data/internal/thirai-isai-paadalgal/provenance.json",
              },
              // Wave 5 P1 — Manthiri Kumari and Raja Rani pin the SAME cinema commit, so they share
              // one checkout directory; the same-directory/same-pin guard below keeps its meaning
              // because both provenance records name that one commit.
              "cinema/manthiri-kumari": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-wave5" },
              "cinema/raja-rani": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-wave5" },
              // Wave 6 Batch 1 — Ammayappan pins the cinema archive at its own later commit (its
              // Reading Room payload postdates the Wave-5 freeze), so it gets its own checkout directory.
              "cinema/ammaiyappan": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-wave6" },
              // Wave 7 Batch 1 — Maruthanattu Ilavarasi, Vandikkaran Magan, Naam pin the SAME later
              // cinema commit (8c1fc37a), so they share one checkout directory; the same-directory/
              // same-pin guard holds because all three provenance records name that one commit.
              "cinema/maruthanattu-ilavarasi": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-wave7-b1" },
              "cinema/vandikkaran-magan": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-wave7-b1" },
              "cinema/naam": { repo: "kalaignar-cinema-works", dir: "kalaignar-cinema-works-wave7-b1" },
              "speeches/udhaya-kathir": { repo: "kalaignar-assembly-speeches" },
              "speeches/poonthottam": { repo: "kalaignar-public-speeches" },
              "speeches/arappor": { repo: "kalaignar-public-speeches" },
              // Shares the public-speeches checkout with Poonthottam and Arappor: all three pin
              // the SAME commit, so one directory serves them and the same-directory/same-pin
              // guard below keeps its meaning. It is deliberately NOT given a directory of its own.
              "speeches/kalaivanar-nsk-memorial-day": { repo: "kalaignar-public-speeches" },
              // Wave 6 Batch 3 — Speeches. namathu-nilai pins the assembly-speeches archive and
              // idhaya-perikai + palli-vazhkkai pin the public-speeches archive, each at a LATER commit
              // than the works above, so they get their OWN checkout directories. idhaya/palli share
              // one public-speeches-wave6 pin, so the same-directory/same-pin guard keeps its meaning.
              "speeches/namathu-nilai": { repo: "kalaignar-assembly-speeches", dir: "kalaignar-assembly-speeches-wave6" },
              "speeches/idhaya-perikai": { repo: "kalaignar-public-speeches", dir: "kalaignar-public-speeches-wave6" },
              "speeches/palli-vazhkkai": { repo: "kalaignar-public-speeches", dir: "kalaignar-public-speeches-wave6" },
              "poems/idhayathai-thanthidu-anna": { repo: "kalaignar-poems" },
              // ── WAVE 4 P1 — the three standalone poems ──────────────────────────────────────
              // These pin the poems archive at the Wave-4 freeze, a LATER commit than
              // idhayathai-thanthidu-anna above, whose own work tree never moved and which is
              // therefore not repinned. Same repository, two historical pins, so they get their own
              // checkout directory — the pattern the Wave-3 essays and the நான்மணி மாலை plays
              // already use. Sharing one directory would make the same-directory/same-pin guard
              // below fire, and loosening that guard would remove the protection it exists to give.
              "poems/anaiya-vilakku-anna": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave4" },
              "poems/marathi": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave4" },
              "poems/thennan-kathai": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave4" },
              // Wave 6 Batch 4 — Poetry. The eight works pin the poems archive at a LATER commit than
              // the Wave-4 poems above, so they get their OWN checkout directory; all eight share ONE
              // pin (recorded in each provenance file), so the same-directory/same-pin guard keeps its
              // meaning. Six standalone poems, one multi-item publication (1975) and one verse-novel.
              "poems/thalaikettan-thambi": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave6" },
              "poems/aanthaiyum-arasanum": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave6" },
              "poems/poomudi": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave6" },
              "poems/anna-kaviyarangam": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave6" },
              "poems/gunanayagar-nehru": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave6" },
              "poems/oruthalaik-kathal": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave6" },
              "poems/kalaignarin-kaviyaranga-kavithaigal-1975": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave6" },
              "poems/kanchithan-annan": { repo: "kalaignar-poems", dir: "kalaignar-poems-wave6" },
              "essays/sakkaravarththiyin-thirumagan": { repo: "kalaignar-essays" },
